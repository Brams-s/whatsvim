name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      - run: npm run package
      - run: npm run verify:package
      - run: sha256sum dist/*.zip > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: whatsvim-package
          path: |
            dist/*.zip
            dist/SHA256SUMS
