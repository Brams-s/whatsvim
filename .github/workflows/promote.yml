name: Promote approved release

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Approved full 40-hex commit SHA already reachable from main
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-approved-sha:
    runs-on: ubuntu-latest
    outputs:
      approved_sha: ${{ steps.verify.outputs.approved_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        env:
          CANDIDATE_SHA: ${{ inputs.approved_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            exit 1
          fi
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)" fetch origin main --no-tags
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          approved_sha="$(git rev-parse "${CANDIDATE_SHA}^{commit}")"
          git merge-base --is-ancestor "$approved_sha" origin/main
          echo "approved_sha=${approved_sha}" >> "$GITHUB_OUTPUT"

  promote:
    needs: validate-approved-sha
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-approved-sha.outputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_SHA: ${{ needs.validate-approved-sha.outputs.approved_sha }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            exit 1
          fi
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      - run: npm run package
      - run: npm run verify:package
      - run: sha256sum dist/*.zip > dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          APPROVED_SHA: ${{ needs.validate-approved-sha.outputs.approved_sha }}
        shell: bash
        run: |
          args=(release create "$TAG" dist/*.zip dist/SHA256SUMS --target "$APPROVED_SHA" --title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
