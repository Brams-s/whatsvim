name: Changesets version PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: changesets/action@v2
        with:
          version-script: npm run version:changesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
